/* ============================= HEURISTISCHE BEOORDELING ============================= */
function extractNumbers(tekst){
  const cleaned = tekst.replace(/[€%]/g," ");
  const matches = cleaned.match(/-?\d{1,3}(?:\.\d{3})+(?:,\d+)?|-?\d+(?:,\d+)?/g) || [];
  return matches.map(s => parseFloat(s.replace(/\./g,"").replace(",", ".")));
}
function scoreAntwoord(q, tekst){
  if (!tekst || !tekst.trim()) return 0;
  const t = tekst.toLowerCase();
  let delen = [];
  if (q.getallen && q.getallen.length){
    const nums = extractNumbers(tekst);
    const hits = q.getallen.filter(target => nums.some(n => Math.abs(n-target) <= Math.max(0.3, Math.abs(target)*0.02))).length;
    delen.push(hits / q.getallen.length);
  }
  if (q.kernwoorden && q.kernwoorden.length){
    const hits = q.kernwoorden.filter(groep => groep.some(w => t.includes(w))).length;
    delen.push(hits / q.kernwoorden.length);
  }
  if (!delen.length) return 0;
  const frac = delen.reduce((s,x)=>s+x,0)/delen.length;
  const score = Math.max(0, Math.min(q.max, q.max*frac));
  return Math.round(score*2)/2;
}

/* ============================= HELPERS ============================= */
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return (Math.round(n*10)/10).toString().replace(".", ","); }
function qTotalSelf(a){ return QUESTIONS.reduce((s,q)=> s + (Number(a?.[q.id]?.selfScore)||0), 0); }
function qTotalProg(a){ return QUESTIONS.reduce((s,q)=> s + (Number(a?.[q.id]?.progScore)||0), 0); }
function groepVoltooid(idx){ return GROUPS[idx].items.filter(i=>i.type==="vraag").every(v => answers[v.id]?.checked); }

function b64encode(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  let binary = ""; bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}
function b64decode(str){
  const binary = atob(str.trim());
  const bytes = new Uint8Array(binary.length);
  for (let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(bytes));
}
function maakCode(){
  return b64encode({ v:1, naam: studentName, antwoorden: answers, totaalSelf: qTotalSelf(answers), totaalProg: qTotalProg(answers), tijd: Date.now() });
}
function saveLocal(){
  localStorage.setItem("vermogen_antwoorden", JSON.stringify(answers));
  localStorage.setItem("vermogen_naam", studentName);
  localStorage.setItem("vermogen_groep", String(huidigeGroep));
}
async function syncNaarSupabase(){
  if (!SUPABASE_AAN || !supabaseClient || !studentName) return;
  syncStatus = "Opslaan...";
  try {
    const { error } = await supabaseClient.from("submissions").upsert({
      naam: studentName, antwoorden: answers,
      totaal_self: qTotalSelf(answers), totaal_prog: qTotalProg(answers),
      bijgewerkt: new Date().toISOString()
    }, { onConflict: "naam" });
    syncStatus = error ? "Opslaan mislukt, probeer het later nog eens." : "Opgeslagen voor je docent ✓";
  } catch(e){ syncStatus = "Opslaan mislukt, probeer het later nog eens."; }

async function laadRemoteData(){
  if (!SUPABASE_AAN || !supabaseClient) return;
  remoteLoading = true; remoteError = null; render();
  try {
    const { data, error } = await supabaseClient.from("submissions").select("*").order("naam");

    remoteRows = (data||[]).map(r => ({ naam:r.naam, totaalSelf:Number(r.totaal_self)||0, totaalProg:Number(r.totaal_prog)||0, antwoorden:r.antwoorden||{} }));

function bindCopyButton(){
  const copyBtn = document.getElementById("copy-code-btn");
  if (!copyBtn) return;
  copyBtn.onclick = async () => {
    const ta = document.getElementById("code-output");
    try { await navigator.clipboard.writeText(ta.value); copyBtn.textContent = "Gekopieerd ✓"; setTimeout(()=>copyBtn.textContent="Kopieer code", 1500); }
    catch(e){ ta.select(); copyBtn.textContent = "Selecteer en kopieer handmatig"; }
  };
}

function scoreOptions(q, a){
  const steps = [];
  for (let v=0; v<=q.max*2; v++) steps.push(v/2);
  return steps.map(v => {
    const active = Number(a.selfScore)===v;
    return `<button data-qid="${q.id}" data-val="${v}" class="self-score-btn text-xs rounded-full px-2.5 py-1 border ${active ? "bg-indigo-600 text-white border-indigo-600" : "bg-white text-slate-600 border-slate-300 hover:border-indigo-400"}">${fmt(v)}</button>`;
  }).join("");
}

            const avgSelf = vals.length ? vals.reduce((s,v)=>s+(Number(v.selfScore)||0),0)/vals.length : 0;
            const avgProg = vals.length ? vals.reduce((s,v)=>s+(Number(v.progScore)||0),0)/vals.length : 0;
            return `<div class="flex items-center gap-3">
              <div class="w-24 text-xs text-slate-500 shrink-0">${esc(q.groep.split(" ").pop())}${q.label?"-"+esc(q.label):""}</div>
              <div class="flex-1 h-2.5 bg-slate-100 rounded-full overflow-hidden relative">
                <div class="absolute h-full bg-indigo-400" style="width:${q.max? Math.min(100, avgSelf/q.max*100):0}%"></div>
              </div>
              <div class="w-28 text-xs text-slate-500 text-right shrink-0">${fmt(avgSelf)}/${q.max} (zelf) · ${fmt(avgProg)}/${q.max} (prog)</div>
            </div>`;
          }).join("")}
        </div>
      </div>
      ` : ``}

      <button id="logout" class="mt-6 text-xs text-slate-400 underline">Docentoverzicht vergrendelen</button>
    </div>`;
  app.innerHTML = html;
  document.getElementById("back").onclick = () => { location.hash=""; view="start"; render(); };
  document.getElementById("logout").onclick = () => { docentOk = false; sessionStorage.removeItem("vermogen_docent_ok"); render(); };
  const refreshBtn = document.getElementById("refresh-btn");
  if (refreshBtn) refreshBtn.onclick = () => laadRemoteData();
  const addBtn = document.getElementById("add-btn");
  if (addBtn) addBtn.onclick = () => {
    const raw = document.getElementById("code-input").value;
    const lines = raw.split(/\n+/).map(l=>l.trim()).filter(Boolean);
    let added = 0, failed = 0;
    const d = getDocentData();
    lines.forEach(line => {
      try { const obj = b64decode(line); if (obj && obj.naam) { d[obj.naam] = obj; added++; } else failed++; }
      catch(e){ failed++; }
    });
    setDocentData(d);
    document.getElementById("add-msg").textContent = `${added} toegevoegd${failed? ", "+failed+" ongeldig":""}.`;
    render();
  };
  app.querySelectorAll(".del-btn").forEach(el => {
    el.onclick = (e) => {
      const naam = e.target.dataset.naam;
      if (!confirm(`Inzending van ${naam} verwijderen?`)) return;
      const d = getDocentData(); delete d[naam]; setDocentData(d); render();
    };
  });
  const csvBtn = document.getElementById("csv-btn");
  if (csvBtn) csvBtn.onclick = async () => {
    const header = ["Leerling", ...QUESTIONS.map(q=>`${q.groep} ${q.label} (zelf)`), ...QUESTIONS.map(q=>`${q.groep} ${q.label} (prog)`), "Totaal zelf","Totaal programma"].join(";");
    const lines = rows.map(r => [r.naam, ...QUESTIONS.map(q=>(r.antwoorden||{})[q.id]?.selfScore??""), ...QUESTIONS.map(q=>(r.antwoorden||{})[q.id]?.progScore??""), fmt(r.totaalSelf||0), fmt(r.totaalProg||0)].join(";"));
    const csv = [header, ...lines].join("\n");
    try { await navigator.clipboard.writeText(csv); csvBtn.textContent = "Gekopieerd ✓"; setTimeout(()=>csvBtn.textContent="Kopieer als CSV", 1500); }
    catch(e){ alert("Kopiëren niet gelukt. Probeer het opnieuw."); }
  };
}

/* ============================= MAIN RENDER ============================= */
function render(){
  if (view === "docent") renderDocent();
  else if (view === "quiz") renderQuiz();
  else renderStart();
}
window.addEventListener("hashchange", () => {
  if (location.hash === "#docent") { view = "docent"; }
  else if (view === "docent") { view = "start"; }
  render();
});
render();
</script>
</body>
</html>
